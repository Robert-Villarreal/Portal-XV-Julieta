<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Pagos · XV Julieta</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 45%,
        #DDECFB 100%
    );
    color:#4A4A4A;
}

.page{
    max-width:1400px;
    margin:auto;
    padding:50px 20px 100px;
}

.btn{
    text-decoration:none;
    padding:12px 22px;
    border-radius:30px;
    background:white;
    color:#4A4A4A;
    border:1px solid #DDD;
}

h1{
    font-size:58px;
    margin-bottom:10px;
}

.intro{
    color:#777;
    margin-bottom:30px;
}

.panel{
    background:white;
    border-radius:28px;
    padding:30px;
    margin-bottom:25px;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.form-grid{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border-radius:12px;
    border:1px solid #DDD;
    box-sizing:border-box;
}

textarea{
    min-height:80px;
}

.guardar{
    margin-top:20px;
    background:#7A1520;
    color:white;
    cursor:pointer;
}

.kpis{
    display:grid;
    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
}

.kpi{
    background:white;
    border-radius:28px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.kpi-num{
    font-size:34px;
    font-weight:bold;
    color:#7A1520;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    text-align:left;
    padding:14px;
    border-bottom:2px solid #ECECEC;
}

td{
    padding:14px;
    border-bottom:1px solid #F0F0F0;
}

</style>

</head>

<body>

<div class="page">

<a
href="gestion-xv.html"
class="btn">

← Volver a Gestión XV

</a>

<h1>
Pagos
</h1>

<div class="intro">

Registro de pagos realizados y seguimiento de saldos.

</div>

<div class="panel">

<h3>
Registrar Pago
</h3>

<div class="form-grid">

<div>

<label>Categoría</label>

<select id="categoria">

<option>Vestido</option>
<option>Foto y Video</option>
<option>Maquillaje y Peinado</option>
<option>Salón / Ambientación</option>
<option>Catering y Bebidas</option>
<option>Shows / Cotillón</option>
<option>Otros</option>

</select>

</div>

<div>

<label>Proveedor</label>

<input id="proveedor">

</div>

<div>

<label>Fecha</label>

<input
id="fecha"
type="date">

</div>

<div>

<label>Moneda</label>

<select id="moneda">

<option>ARS</option>
<option>USD</option>

</select>

</div>

<div>

<label>Importe</label>

<input
id="importe"
type="number">

</div>

<div>

<label>Concepto</label>

<input id="concepto">

</div>

</div>

<br>

<label>Observaciones</label>

<textarea
id="observaciones"></textarea>

<button
class="btn guardar"
onclick="guardarPago()">

Guardar Pago

</button>

</div>

<div class="kpis">

<div class="kpi">

<div
id="pagadoArs"
class="kpi-num">

$ 0

</div>

<div>
Pagado ARS
</div>

</div>

<div class="kpi">

<div
id="pagadoUsd"
class="kpi-num">

USD 0

</div>

<div>
Pagado USD
</div>

</div>

<div class="kpi">

<div
id="equivalente"
class="kpi-num">

$ 0

</div>

<div class="kpi">

    <div
        id="saldoProveedor"
        class="kpi-num">

        $ 0

    </div>

    <div>

        Saldo Salon Sanfiz

    </div>

</div>
    
<div>
Equivalente ARS
</div>

</div>

</div>

<div class="panel">

<table>

<thead>

<tr>

<th>Fecha</th>
<th>Categoría</th>
<th>Proveedor</th>
<th>Concepto</th>
<th>Moneda</th>
<th>Importe</th>
<th>Acción</th>

</tr>

</thead>

<tbody id="tablaPagos">

</tbody>

</table>

</div>

</div>

<script>

const supabaseClient =
window.supabase.createClient(
'https://gjdgrxjgtjnzvipfpsvw.supabase.co',
'sb_publishable_cyRW2xlQP_PdOSWJG9HkPg_jhJck75M'
);

const tc = 1420;

async function guardarPago(){

    const datos={

        categoria:categoria.value,

        proveedor:proveedor.value,

        fecha:fecha.value,

        concepto:concepto.value,

        moneda:moneda.value,

        importe:Number(importe.value),

        observaciones:observaciones.value

    };

    const {error} =
    await supabaseClient
    .from("pagos")
    .insert(datos);

    if(error){

        alert(error.message);
        return;
    }

    location.reload();
}

async function cargarPagos(){

    const {data,error} =
    await supabaseClient
    .from("pagos")
    .select("*")
    .order("fecha",{ascending:false});

    if(error){

        alert(error.message);
        return;
    }

    const tabla =
    document.getElementById(
        "tablaPagos"
    );

    tabla.innerHTML="";

    let ars=0;
    let usd=0;
    let pagadoSalon=0;

    data.forEach(p=>{

        if(p.moneda==="USD"){

            usd += Number(p.importe);

        }
        if(
    p.proveedor === "Salon Sanfiz"
){

    pagadoSalon +=
    Number(p.importe || 0);
}
        else{

            ars += Number(p.importe);
        }

        const tr =
        document.createElement("tr");

        tr.innerHTML=

'<td>'+p.fecha+'</td>'

+

'<td>'+p.categoria+'</td>'

+

'<td>'+p.proveedor+'</td>'

+

'<td>'+p.concepto+'</td>'

+

'<td>'+p.moneda+'</td>'

+

'<td>$ '+
Number(p.importe)
.toLocaleString("es-AR")
+'</td>'

+

'<td><button onclick="eliminarPago('+
p.id+
')">🗑️</button></td>';

        tabla.appendChild(tr);

    });

    document
    .getElementById("pagadoArs")
    .innerText =
    "$ " +
    ars.toLocaleString("es-AR");

    document
    .getElementById("pagadoUsd")
    .innerText =
    "USD " +
    usd.toLocaleString("es-AR");

    document
    .getElementById("equivalente")
    .innerText =
        const comprometidoSalon =
16672000;

const saldoSalon =
comprometidoSalon -
pagadoSalon;

document
.getElementById("saldoProveedor")
.innerText =
"$ " +
saldoSalon.toLocaleString("es-AR");
    "$ " +
    (ars + usd * tc)
    .toLocaleString("es-AR");

}

cargarPagos();
    async function eliminarPago(id){

    if(!confirm("¿Eliminar pago?"))
        return;

    const {error} =
    await supabaseClient
    .from("pagos")
    .delete()
    .eq("id",id);

    if(error){

        alert(error.message);
        return;
    }

    cargarPagos();
}

</script>

</body>

</html>
