<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nueva Idea | XV Julieta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#FAF9F7 0%,#F5DCE8 45%,#DDECFB 100%);color:#4A4A4A}
.idea-page{max-width:800px;margin:auto;padding:60px 20px}.card{background:#fff;border-radius:28px;padding:30px}
input[type=text],textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;box-sizing:border-box}
textarea{min-height:140px}.campo{margin-bottom:20px}.btn{padding:12px 20px;border:none;border-radius:22px;cursor:pointer}
.guardar{background:#EAD9C6}.volver{text-decoration:none;color:#666}
</style>
</head>
<body>
<section class="idea-page">
<a class="volver" href="ideas-vestido.html">← Volver a Ideas</a>
<div class="card">
<h1>Nueva Idea</h1>
<div class="campo"><label>Título</label><input id="titulo" type="text"></div>
<div class="campo"><label>Foto</label><input id="foto" type="file" accept="image/*"></div>
<div class="campo"><label>Comentario</label><textarea id="comentario"></textarea></div>
<button class="btn guardar" onclick="guardarIdea()">Guardar</button>
<div id="estado"></div>
</div>
</section>
<script>
const supabase = window.supabase.createClient(
'https://gjdgrxjgtjnzvipfpsvw.supabase.co',
'sb_publishable_cyRW2xlQP_PdOSWJG9HkPg_jhJck75M'
);
async function guardarIdea(){
const titulo=document.getElementById('titulo').value.trim();
const comentario=document.getElementById('comentario').value.trim();
const file=document.getElementById('foto').files[0];
if(!titulo||!comentario){alert('Completá título y comentario');return;}
let imagen='';
if(file){
 const nombre=Date.now()+'_'+file.name.replace(/\s+/g,'_');
 const subida=await supabase.storage.from('Vestidos').upload(nombre,file);
 if(subida.error){alert('Error al subir foto: '+subida.error.message);return;}
 const pub=supabase.storage.from('Vestidos').getPublicUrl(nombre);
 imagen=pub.data.publicUrl;
}
const {error}=await supabase.from('ideas_vestido').insert({titulo,comentario,fecha:new Date().toLocaleDateString('es-AR'),imagen});
if(error){alert('Error al guardar: '+error.message);return;}
document.getElementById('estado').innerHTML='✅ Idea guardada';
setTimeout(()=>location.href='ideas-vestido.html',1000);
}
</script>
</body></html>
