<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Complementos del Look · XV Julieta</title>

<style>

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 45%,
        #DDECFB 100%
    );

    color:#4A4A4A;
}

.container{

    max-width:1200px;

    margin:auto;

    padding:50px 20px 100px;
}

.volver{

    text-decoration:none;

    color:#666;

    display:inline-block;

    margin-bottom:30px;
}

h1{

    text-align:center;

    font-size:64px;

    margin-bottom:15px;
}

.intro{

    text-align:center;

    color:#777;

    max-width:700px;

    margin:0 auto 50px;

    line-height:1.8;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

    gap:25px;
}

.card{

    background:
    rgba(255,255,255,.75);

    backdrop-filter:blur(12px);

    border-radius:34px;

    padding:35px;

    box-shadow:
    0 12px 30px rgba(0,0,0,.05);

    transition:.3s;
}

.card:hover{

    transform:translateY(-5px);
}

.card h2{

    margin-bottom:15px;

    font-size:30px;
}

.estado{

    display:inline-block;

    margin-top:10px;

    padding:8px 18px;

    border-radius:20px;

    background:#F5F5F5;

    color:#666;

    font-size:14px;
}

@media(max-width:768px){

    h1{

        font-size:48px;
    }

    .grid{

        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<div class="container">

    <a
       class="volver"
       href="mi-look-v2.html">

       ← Volver a Mi Look

    </a>

    <h1>
        Complementos del Look
    </h1>

    <p class="intro">

        Maquillaje, peinado, accesorios y detalles que completan Mi look

    </p>

    <div class="grid">

        <div class="card">

            <h2>
                Maquillaje y Peinado
            </h2>

            <span class="estado">
                Pendiente
            </span>

        </div>

        <div class="card">

            <h2>
                Zapatos
            </h2>

            <span class="estado">
                Pendiente
            </span>

        </div>

        <div class="card">

            <h2>
                Accesorios
            </h2>

            <span class="estado">
                Pendiente
            </span>

        </div>

        <div class="card">

            <h2>
                Tocado
            </h2>

            <span class="estado">
                Pendiente
            </span>

        </div>

        <div class="card">

            <h2>
                Manicura
            </h2>

            <span class="estado">
                Pendiente
            </span>

        </div>

        <div class="card">

            <h2>
                Otros
            </h2>

            <span class="estado">
                Pendiente
            </span>

        </div>

    </div>

</div>

</body>

</html>
