<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mi Look · XV Julieta</title>

<style>

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 45%,
        #DDECFB 100%
    );

    color:#4A4A4A;
}

.container{

    max-width:1200px;

    margin:auto;

    padding:50px 20px 100px;
}

.volver{

    text-decoration:none;

    color:#666;

    display:inline-block;

    margin-bottom:30px;
}

h1{

    text-align:center;

    font-size:64px;

    margin-bottom:15px;
}

.intro{

    text-align:center;

    max-width:700px;

    margin:0 auto 50px;

    color:#777;

    line-height:1.8;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(260px,1fr));

    gap:25px;
}

    .look-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(320px,1fr));

    gap:30px;
}
.card{

    text-decoration:none;

    color:#4A4A4A;

    background:
    rgba(255,255,255,.75);

    backdrop-filter:blur(12px);

    border-radius:32px;

    padding:40px;

    box-shadow:
    0 12px 30px rgba(0,0,0,.05);

    transition:.3s;
}

.card:hover{

    transform:translateY(-4px);
}

.card h2{

    margin-bottom:20px;

    font-size:32px;
}

.card p{

    color:#777;

    line-height:1.8;
}
    .card{

    text-align:center;
}

.card h2{

    text-align:center;
}

.card p{

    text-align:center;

    line-height:1.8;
}

.cta{

    display:block;

    margin-top:25px;

    color:#D4AF37;

    font-weight:bold;

    letter-spacing:2px;
}

@media(max-width:768px){

    h1{

        font-size:48px;
    }

    .grid{

        grid-template-columns:1fr;
    }
}

</style>

</head>

<body>

<div class="container">

    <a
       class="volver"

    </a>

    <h1>
        Mi Look
    </h1>

    <p class="intro">

        Todo lo relacionado con mi imagen personal

    </p>

    <div class="grid">

        <a
           href="mi-vestido.html"
           class="card">

            <h2>Mi Vestido</h2>

            <p>

                Ideas guardadas<br>
                Reuniones<br>
                Proveedor elegido

            </p>

            <span class="cta">
                EXPLORAR
            </span>

        </a>

 <a
    href="ideas-adicionales.html"
    class="card">

    <h2>
Ideas Adicionales
</h2>

<p>
