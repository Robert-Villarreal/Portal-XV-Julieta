<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idea | XV Julieta</title>

<style>

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 45%,
        #DDECFB 100%
    );

    color:#4A4A4A;

}

.idea-page{

    max-width:900px;

    margin:auto;

    padding:60px 20px;

}

.volver{

    display:inline-block;

    margin-bottom:25px;

    text-decoration:none;

    color:#666;

    font-size:15px;

}

.idea-card{

    background:white;

    border-radius:30px;

    padding:30px;

    border:1px solid rgba(191,197,204,.20);

    box-shadow:
    0 8px 25px rgba(0,0,0,.05);

}

.idea-img{

    width:100%;

    border-radius:20px;

    margin-bottom:25px;

    overflow:hidden;

}

.idea-img img{

    width:100%;

    display:block;

}

.idea-texto{

    font-size:22px;

    line-height:1.8;

    margin-bottom:20px;

}

.idea-fecha{

    color:#888;

    font-size:14px;

    margin-bottom:25px;

}

.idea-actions{

    display:flex;

    gap:12px;

}

.btn{

    border:none;

    border-radius:22px;

    padding:12px 22px;

    cursor:pointer;

    font-size:15px;

}

.btn-editar{

    background:#EAD9C6;

    color:#4A4A4A;

}

.btn-eliminar{

    background:#F2F2F2;

    color:#4A4A4A;

}

.btn-editar:hover{

    background:#E1D0BD;

}

.btn-eliminar:hover{

    background:#E8E8E8;

}

@media(max-width:900px){

    .idea-texto{

        font-size:18px;

    }

}

</style>

</head>

<body>

<section class="idea-page">

    <a href="ideas-vestido.html" class="volver">

        ← Volver a Ideas

    </a>

    <div class="idea-card">

        <div class="idea-texto">

            Me gusta este vestido porque tiene una caída elegante y una falda amplia.
            Consultar si puede realizarse en color champagne.

        </div>

        <div class="idea-fecha">

            06/08/2026

        </div>

        <div class="idea-actions">

            <button class="btn btn-editar">

                Editar

            </button>

            <button class="btn btn-eliminar">

                Eliminar

            </button>

        </div>

    </div>

</section>

</body>

</html>
