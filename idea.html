<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Idea | XV Julieta</title>

<style>

body{

    margin:0;

    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 45%,
        #DDECFB 100%
    );

    color:#4A4A4A;

}

.idea-page{

    max-width:1000px;

    margin:auto;

    padding:60px 20px;

}

.volver{

    display:inline-block;

    margin-bottom:30px;

    text-decoration:none;

    color:#666;

    font-size:15px;

}

.idea-detalle{

    background:white;

    border-radius:30px;

    padding:35px;

    border:1px solid rgba(191,197,204,.20);

    box-shadow:
    0 8px 25px rgba(0,0,0,.05);

}

.idea-fecha{

    color:#888;

    font-size:14px;

    margin-bottom:20px;

}

.idea-imagen{

    height:450px;

    background:#F5F5F5;

    border-radius:20px;

    margin-bottom:25px;

}

.idea-comentario{

    font-size:18px;

    line-height:1.8;

    margin-bottom:30px;

}

.idea-actions{

    display:flex;

    gap:12px;
}

.btn-editar{

    background:#EAD9C6;

    border:none;

    border-radius:24px;

    padding:12px 24px;

    cursor:pointer;

    color:#4A4A4A;

}

.btn-eliminar{

    background:#F2F2F2;

    border:none;

    border-radius:24px;

    padding:12px 24px;

    cursor:pointer;

    color:#4A4A4A;

}

.btn-editar:hover{

    background:#E1D0BD;

}

.btn-eliminar:hover{

    background:#E8E8E8;

}

@media(max-width:900px){

    .idea-imagen{

        height:280px;

    }

    .idea-comentario{

        font-size:16px;

    }

}

</style>

</head>

<body>

<section class="idea-page">

    <a href="ideas-vestido.html" class="volver">

        ← Volver a Ideas

    </a>

    <div class="idea-detalle">

        <div class="idea-fecha">

            06/08/2026

        </div>

        <div class="idea-imagen">

        </div>

        <div class="idea-comentario">

            Me gusta el corte princesa.
            Consultar con la modista si puede realizarse
            en tono champagne y evaluar opciones con
            falda amplia.

        </div>

        <div class="idea-actions">

            <button class="btn-editar">

                Editar

            </button>

            <button class="btn-eliminar">

                Eliminar

            </button>

        </div>

    </div>

</section>

</body>

</html>
