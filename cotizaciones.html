<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cotizaciones · XV Julieta</title>

<style>

body{

    margin:0;
    font-family:Arial,sans-serif;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 45%,
        #DDECFB 100%
    );

    color:#4A4A4A;
}

.page{

    max-width:1300px;

    margin:auto;

    padding:50px 20px 100px;
}

.top{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.btn{

    text-decoration:none;

    padding:12px 22px;

    border-radius:30px;

    background:white;

    color:#4A4A4A;

    border:1px solid #DDD;
}

h1{

    font-size:58px;

    margin-bottom:10px;
}

.intro{

    color:#777;

    max-width:800px;

    margin-bottom:40px;

    line-height:1.8;
}

.panel{

    background:white;

    border-radius:28px;

    padding:30px;

    margin-bottom:30px;

    box-shadow:
    0 10px 30px rgba(0,0,0,.05);
}

.form-grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));

    gap:20px;
}

input,
select{

    width:100%;

    padding:12px;

    border-radius:12px;

    border:1px solid #DDD;

    box-sizing:border-box;
}

.resumen{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(250px,1fr));

    gap:20px;

    margin-bottom:30px;
}

.kpi{

    background:white;

    border-radius:28px;

    padding:25px;

    text-align:center;

    box-shadow:
    0 10px 25px rgba(0,0,0,.05);
}

.kpi-num{

    font-size:36px;

    color:#7A1520;

    font-weight:bold;
}

.grid{

    display:grid;

    grid-template-columns:
    repeat(auto-fit,minmax(300px,1fr));

    gap:25px;
}

.card{

    background:white;

    border-radius:28px;

    padding:25px;

    box-shadow:
    0 10px 25px rgba(0,0,0,.05);
}

.selected{

    border:2px solid #D4AF37;

    background:#FFF9E8;
}

.badge{

    display:inline-block;

    padding:8px 14px;

    border-radius:20px;

    background:#F5EABE;

    color:#8B6B00;

    font-size:12px;

    font-weight:bold;

    margin-bottom:15px;
}

.monto{

    font-size:34px;

    color:#7A1520;

    font-weight:bold;

    margin:15px 0;
}

.small{

    color:#777;

    margin-top:10px;
}
.tabla-cotizaciones{

    width:100%;

    border-collapse:collapse;
}

.tabla-cotizaciones th{

    text-align:left;

    padding:14px;

    border-bottom:2px solid #EEE;

    color:#666;
}

.tabla-cotizaciones td{

    padding:14px;

    border-bottom:1px solid #F0F0F0;
}

.estado-ok{

    color:#2E7D32;

    font-weight:700;
}

.estado-pendiente{

    color:#B8860B;

    font-weight:700;
}

.desvio-positivo{

    color:#C62828;

    font-weight:700;
}

.desvio-cero{

    color:#2E7D32;

    font-weight:700;
}
@media(max-width:768px){

    h1{

        font-size:42px;
    }

    .grid{

        grid-template-columns:1fr;
    }
}

</style>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    
</script>
    
</head>

<body>

<div class="page">

    <div class="top">

       <a
   href="gestion-xv.html"
   class="btn">

   ← Volver a Gestión XV

</a>

    </div>

    <h1>
        Cotizaciones
    </h1>

    <div class="intro">

        Comparación de proveedores,
        monedas, conversiones y decisiones financieras.

    </div>

    <div class="panel">

        <h3>
            Tipo de Cambio
        </h3>

        <br>

        <div class="form-grid">

            <div>

                <label>
                    Fecha
                </label>

                <input
                    type="date"
                    id="fechaTc">

            </div>

            <div>

                <label>
                    USD Referencia
                </label>

                <input
                    type="number"
                    id="tc"
                    value="1420">

            </div>

        </div>

    </div>

    <div class="panel">

    <div class="form-grid">

        <div>

            <label>
                Categoría
            </label>

            <select id="filtroCategoria">

                <option>Todas</option>
                <option>Vestido</option>
                <option>Foto y Video</option>
                <option>Maquillaje y Peinado</option>
                <option>Salón / Ambientación</option>
                <option>Catering y Bebidas</option>
                <option>Shows / Cotillón</option>
                <option>Otros</option>

            </select>

        </div>

    </div>

</div>

<div class="panel">

    <table class="tabla-cotizaciones">

        <thead>

            <tr>

                <th>Categoría</th>
                <th>Proveedor</th>
                <th>Moneda</th>
                <th>Cotización</th>
                <th>Equiv. ARS</th>
                <th>Objetivo</th>
                <th>Desvío</th>
                <th>Estado</th>

            </tr>

        </thead>

        <tbody id="tablaCotizaciones">

        </tbody>

    </table>

</div>

</div>

<div
    id="grid"
    class="grid">

</div>
</div>

<script>

const supabaseClient =
window.supabase.createClient(
'https://gjdgrxjgtjnzvipfpsvw.supabase.co',
'sb_publishable_cyRW2xlQP_PdOSWJG9HkPg_jhJck75M'
);

document
.getElementById("filtroCategoria")
.addEventListener(
    "change",
    cargar
);

document
.getElementById("tc")
.addEventListener(
    "input",
    cargar
);

async function cargar(){

    const tc =
    Number(
        document.getElementById("tc").value
    ) || 1;

    const filtro =
    document.getElementById(
        "filtroCategoria"
    ).value;

    const {data,error} =
    await supabaseClient
    .from("reuniones")
    .select("*");

    if(error){

        alert(error.message);
        return;
    }

    let registros =
    data.filter(
        r => Number(r.cotizacion || 0) > 0
    );

    if(filtro !== "Todas"){

        registros =
        registros.filter(
            r => r.categoria === filtro
        );
    }

    let totalARS = 0;
    let totalUSD = 0;

    const grid =
    document.getElementById("grid");

    grid.innerHTML = "";

    registros.forEach(r => {

        const moneda =
        r.moneda || "ARS";

        const importe =
        Number(r.cotizacion || 0);

        const equivalente =
        moneda === "USD"
        ? importe * tc
        : importe;

        if(moneda === "USD"){

            totalUSD += importe;

        }else{

            totalARS += importe;
        }

      const objetivo =
objetivos[r.categoria] || 0;

const desvio =
equivalente - objetivo;

const fila =
document.createElement("tr");

fila.innerHTML =

'<td>' + r.categoria + '</td>'

+

'<td>' + r.proveedor + '</td>'

+

'<td>' + moneda + '</td>'

+

'<td>'
+ importe.toLocaleString("es-AR")
+ '</td>'

+

'<td>$ '
+ equivalente.toLocaleString("es-AR")
+ '</td>'

+

'<td>$ '
+ objetivo.toLocaleString("es-AR")
+ '</td>'

+

'<td class="' +
(desvio > 0
? 'desvio-positivo'
: 'desvio-cero')
+ '">'

+

(desvio > 0 ? '+' : '')

+

'$ '
+ desvio.toLocaleString("es-AR")

+

'</td>'

+

'<td class="' +
(r.elegido
? 'estado-ok'
: 'estado-pendiente')
+ '">'

+

(r.elegido
? 'Seleccionado'
: 'Pendiente')

+

'</td>';

document
.getElementById("tablaCotizaciones")
.appendChild(fila);

        card.innerHTML =

        (r.elegido
            ? '<div class="badge">⭐ PROVEEDOR SELECCIONADO</div>'
            : '')

        +

        '<h2>' +
        (r.proveedor || '-') +
        '</h2>'

        +

        '<div>'
        + (r.categoria || '')
        + '</div>'

        +

        '<div class="monto">'
        + moneda + ' '
        + importe.toLocaleString('es-AR')
        + '</div>'

        +

        '<div class="small">'
        + 'Equivalente ARS: $ '
        + equivalente.toLocaleString('es-AR')
        + '</div>';

        grid.appendChild(card);

    });

    document
    .getElementById("ars")
    .innerText =
    '$ ' +
    totalARS.toLocaleString('es-AR');

    document
    .getElementById("usd")
    .innerText =
    'USD ' +
    totalUSD.toLocaleString('es-AR');
const comprometido =
totalARS +
(totalUSD * tc);

const pendiente =
presupuestoObjetivo -
comprometido;

document
.getElementById("objetivo")
.innerText =
'$ ' +
presupuestoObjetivo.toLocaleString('es-AR');

document
.getElementById("pendiente")
.innerText =
'$ ' +
pendiente.toLocaleString('es-AR');
    document
    .getElementById("equiv")
    .innerText =
    '$ ' +
    (
        totalARS +
        (totalUSD * tc)
    ).toLocaleString('es-AR');

}

cargar();
const presupuestoObjetivo = 24997000;
const objetivos = {

    "Vestido": 700000,

    "Foto y Video": 2500000,

    "Maquillaje y Peinado": 250000,

    "Salón / Ambientación": 16672000,

    "Catering y Bebidas": 845000,

    "Shows / Cotillón": 1810000,

    "Otros": 0

};
    
</script>

</body>

</html>
