<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <a class="btn sec" href="index.html#mi-look">
   ← Volver a Mi Look
</a>
  <title>Mi Vestido v4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#FAF9F7,#F5DCE8,#DDECFB);color:#444}
    .vestido{max-width:1400px;margin:auto;padding:50px 20px}
    .card{background:#fff;border-radius:28px;padding:28px;box-shadow:0 8px 25px rgba(0,0,0,.05)}
    .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
    .btn{display:inline-block;padding:10px 18px;border-radius:22px;text-decoration:none;margin:5px}
    .sec{background:#f5f5f5;border:1px solid #ddd;color:#444}.pri{background:#ead9c6;color:#444}
    .star{color:#b8860b;font-weight:bold}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style>
</head>
  <body>
    <section class="vestido"><h1>Mi Vestido</h1><div class="grid"><div class="card"><h2>Ideas / Fotos / Notas</h2><p>Ideas guardadas: <span id="contadorIdeas">0</span></p><p>Última actualización: <span id="ultimaIdea">-</span>
    </p><a class="btn sec" href="ideas-vestido.html">Ver Ideas</a><a class="btn pri" href="nueva-idea.html">+ Nueva Idea</a></div>
      <div class="card"><h2>Reuniones</h2><p>Reuniones registradas: <span id="cantReuniones">0</span></p><p>Próxima reunión:</p><p><strong id="proxProveedor">-</strong></p><p id="proxFecha">-</p><p>Proveedor elegido:</p><p id="proveedorElegido">-</p><a class="btn sec" href="reuniones.html">Ver Reuniones</a>
        <a class="btn pri" href="nueva-reunion.html">+ Nueva Reunión</a></div><div class="card"><h2>Cotizaciones</h2><p>Se alimentarán desde reuniones.</p></div></div></section>
    <script>const s=window.supabase.createClient('https://gjdgrxjgtjnzvipfpsvw.supabase.co','sb_publishable_cyRW2xlQP_PdOSWJG9HkPg_jhJck75M');async function cargar(){let r=await s.from('ideas_vestido').select('*').order('id',{ascending:false});if(r.data){contadorIdeas.textContent=r.data.length;if(r.data.length)ultimaIdea.textContent=r.data[0].fecha||'-';}let q=await s.from('reuniones').select('*').order('fecha',{ascending:true});if(q.data){cantReuniones.textContent=q.data.length;if(q.data.length){proxProveedor.textContent=q.data[0].proveedor||'-';proxFecha.textContent=(q.data[0].fecha||'-')+' '+(q.data[0].hora||'');}const elegido=q.data.find(x=>x.elegido===true);if(elegido){proveedorElegido.innerHTML='<span class="star">⭐ '+elegido.proveedor+'</span>';}}}cargar();
        </script></body>
</html>
