<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test XV Julieta</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 50%,
        #DDECFB 100%
    );

    font-family:Arial,sans-serif;
}

.sello{

    width:300px;

    filter:
    drop-shadow(
        0 20px 40px rgba(0,0,0,.18)
    );
}

h1{

    font-size:72px;

    margin-top:20px;

    color:#4A4A4A;
}
.contador{

    text-align:center;

    padding:80px 20px;
}

#dias{

    font-size:120px;

    font-weight:700;

    color:#7A1520;

    font-family:'Playfair Display',serif;
}

.contador p{

    letter-spacing:5px;

    color:#777;

    font-size:18px;
}
.fecha{

    color:#D4AF37;

    font-weight:bold;

    letter-spacing:4px;
}

.frase{

    color:#666;

    margin-top:20px;

    font-size:24px;
}

</style>

</head>

<body>

<div>

<img
src="sello-jv.png"
class="sello"
alt="Sello JV">

<h1>Julieta</h1>

<div class="fecha">
XV · 27 Diciembre 2026
</div>
<section class="contador">

    <div id="dias">
        0
    </div>

    <p>
        DÍAS PARA TUS XV
    </p>

</section>
    
<div class="frase">
Camino hacia un día único
</div>

</div>

</body>
</html>
