<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Test XV Julieta</title>

<style>

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;

    background:
    linear-gradient(
        180deg,
        #FAF9F7 0%,
        #F5DCE8 50%,
        #DDECFB 100%
    );

    font-family:Arial,sans-serif;
}

.sello{

    width:300px;

    filter:
    drop-shadow(
        0 20px 40px rgba(0,0,0,.18)
    );
}

h1{

    font-size:72px;

    margin-top:20px;

    color:#4A4A4A;
}
.contador{

    padding:30px 20px 60px;
}

#dias{

    font-size:120px;

    font-weight:700;

    color:#7A1520;

    font-family:'Playfair Display',serif;
}
    .boton{

    display:inline-block;

    margin-top:30px;

    text-decoration:none;

    padding:16px 42px;

    border-radius:40px;

    background:
    linear-gradient(
        90deg,
        #D4AF37,
        #F5E19A
    );

    color:#5A4712 !important;

    font-weight:700;

    letter-spacing:2px;

    font-size:12px;

    text-transform:uppercase;

    border:none;

    box-shadow:
    0 10px 25px rgba(212,175,55,.35);
}

.boton:hover{

    transform:translateY(-2px);

    text-decoration:none;
}
.agenda-home{

    padding:40px 20px 60px;

    text-align:center;
}

.agenda-home h2{

    font-family:'Playfair Display',serif;

    font-size:48px;

    margin-bottom:40px;
}

.agenda-card{

    max-width:800px;

    margin:auto;

    background:white;

    border-radius:32px;

    padding:40px;

    box-shadow:
    0 12px 30px rgba(0,0,0,.05);
}

.small-title{

    letter-spacing:4px;

    color:#999;

    font-size:12px;

    margin-bottom:20px;
}

.proveedor{

    font-size:42px;

    font-family:'Playfair Display',serif;

    color:#7A1520;

    margin-bottom:15px;
}

.fecha-reunion{

    color:#666;

    margin-bottom:30px;
}
.contador p{

    letter-spacing:5px;

    color:#777;

    font-size:18px;
}
.fecha{

    color:#D4AF37;

    font-weight:bold;

    letter-spacing:4px;
}

.frase{

    color:#666;

    margin-top:20px;

    font-size:24px;
}

</style>

</head>

<body>

<div>

<img
src="sello-jv.png"
class="sello"
alt="Sello JV">

<h1>Julieta</h1>

<div class="fecha">
XV · 27 Diciembre 2026
</div>
<section class="contador">

    <div id="dias">
        0
    </div>

    <p>
        DÍAS PARA TUS XV
    </p>

</section>
    <section class="agenda-home">

    <h2>
        Agenda Destacada
    </h2>

    <div class="agenda-card">

        <div class="small-title">
            PRÓXIMA REUNIÓN
        </div>

        <div class="proveedor">
            Trianna
        </div>

        <div class="fecha-reunion">
            01 Septiembre 2026 · 15:00 hs
        </div>

        <a
            href="agenda.html"
            class="boton">

            EXPLORAR AGENDA

        </a>

    </div>

</section>
<div class="frase">
Camino hacia un día único
</div>

</div>
<script>

const fechaEvento =
new Date("2026-12-27T13:00:00");

const hoy =
new Date();

const diferencia =
fechaEvento - hoy;

const dias =
Math.ceil(
diferencia /
(1000*60*60*24)
);

document.getElementById(
"dias"
).innerHTML = dias;

</script>
</body>
</html>
