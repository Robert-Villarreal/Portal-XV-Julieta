<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Reuniones XV</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    
  </script><style>body{margin:0;font-family:Arial;background:linear-gradient(180deg,#FAF9F7,#F5DCE8,#DDECFB);color:#444}
    .page{max-width:1400px;margin:auto;padding:40px 20px}.top{display:flex;justify-content:space-between;flex-wrap:wrap}
    .btn{text-decoration:none;padding:12px 22px;border-radius:24px}
    .back{background:#fff;border:1px solid #ddd;color:#555}
    .new{background:#ead9c6;color:#444}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:20px;margin-top:30px}
    .card{background:#fff;border-radius:24px;padding:22px;text-decoration:none;color:#444;box-shadow:0 8px 25px rgba(0,0,0,.05)}
    .selected{border:2px solid #d4af37;background:#fffdf3}
    .badge{color:#b8860b;font-weight:bold}.meta{color:#777;font-size:14px}
  </style></head>
  <body>
    <div class="page"><div class="top"><a class="btn back" href="mi-look-v2.html">← Volver</a>
      <a class="btn new" href="nueva-reunion.html">+ Nueva Reunión</a></div><h1>Reuniones</h1><div id="grid" class="grid">
        
      </div></div><script>const supabaseClient=window.supabase.createClient('https://gjdgrxjgtjnzvipfpsvw.supabase.co','sb_publishable_cyRW2xlQP_PdOSWJG9HkPg_jhJck75M');async function cargar(){const {data,error}=await supabaseClient.from('reuniones').select('*').order('fecha',{ascending:true});const g=document.getElementById('grid');if(error){g.innerHTML='Error: '+error.message;return;}if(!data.length){g.innerHTML='<p>No hay reuniones registradas.</p>';return;}data.forEach(r=>{const a=document.createElement('a');a.href='reunion.html?id='+r.id;a.className='card'+(r.elegido?' selected':'');a.innerHTML=(r.elegido?'<div class="badge">⭐ PROVEEDOR SELECCIONADO</div>':'')+'<h3>'+ (r.proveedor||'Sin proveedor') +'</h3><p><strong>'+ (r.categoria||'') +'</strong></p><p>'+ (r.fecha||'') +' '+ (r.hora||'') +'</p><p>Estado: '+ (r.estado||'-') +'</p><p>Prioridad: '+ (r.prioridad||'-') +'</p><p>Cotización: $'+ (r.cotizacion||0) +'</p><div class="meta">Click para abrir</div>';g.appendChild(a);});}cargar();</script>
  </body>
</html>
