<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Agenda XV Julieta</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#FAF9F7,#F5DCE8,#DDECFB);color:#444}
.page{max-width:1400px;margin:auto;padding:30px 20px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:22px;text-decoration:none}.sec{background:#fff;border:1px solid #ddd;color:#444}.pri{background:#ead9c6;color:#444}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-top:25px}
.day{background:#fff;border-radius:20px;padding:12px;min-height:250px}
.day h3{margin:0 0 10px 0;font-size:16px}
.event{display:block;text-decoration:none;color:#333;border-radius:12px;padding:8px;margin:8px 0}
.vestido{background:#F5DCE8}.foto{background:#DDECFB}.maq{background:#E9D5FF}.salon{background:#D8F3DC}.catering{background:#FBE7C6}.show{background:#FFD6D6}.otros{background:#eee}
.star{border:2px solid #d4af37}.stats{display:flex;gap:20px;margin-top:15px}
@media(max-width:900px){.week{grid-template-columns:1fr}.day{min-height:auto}}
</style>
</head><body><div class="page">
<div class="top"><a class="btn sec" href="index.html">← Portal</a><div><a class="btn sec" href="reuniones.html">Ver Reuniones</a><a class="btn pri" href="nueva-reunion.html">+ Nueva Reunión</a></div></div>
<h1>Agenda XV Julieta</h1>
<div class="stats"><div>Próximas reuniones: <span id="cant">0</span></div><div>Proveedores seleccionados: <span id="sel">0</span></div></div>
<h3 id="tituloSemana"></h3>
<div><button onclick="cambiar(-7)">◀ Semana anterior</button> <button onclick="cambiar(7)">Semana siguiente ▶</button></div>
<div id="week" class="week"></div>
</div>
<script>
const s=window.supabase.createClient('https://gjdgrxjgtjnzvipfpsvw.supabase.co','sb_publishable_cyRW2xlQP_PdOSWJG9HkPg_jhJck75M');
let offset=0; const dias=['Dom','Lun','Mar','Mie','Jue','Vie','Sab'];
function cls(c){if(c==='Vestido')return'vestido';if(c==='Foto y Video')return'foto';if(c==='Maquillaje y Peinado')return'maq';if(c==='Salón / Ambientación')return'salon';if(c==='Catering y Bebidas')return'catering';if(c==='Shows / Cotillón')return'show';return'otros';}
async function cargar(){const r=await s.from('reuniones').select('*');const data=r.data||[];cant.textContent=data.length;sel.textContent=data.filter(x=>x.elegido).length;const now=new Date();now.setDate(now.getDate()-now.getDay()+1+offset);tituloSemana.textContent='Semana de '+now.toLocaleDateString('es-AR');week.innerHTML='';for(let i=0;i<7;i++){const d=new Date(now);d.setDate(now.getDate()+i);const iso=d.toISOString().split('T')[0];let html='<div class="day"><h3>'+dias[d.getDay()]+' '+d.getDate()+'</h3>';data.filter(x=>x.fecha===iso).forEach(e=>{html+='<a class="event '+cls(e.categoria)+(e.elegido?' star':'')+'" href="reunion.html?id='+e.id+'">'+(e.elegido?'⭐ ':'')+'<strong>'+e.proveedor+'</strong><br>'+e.hora+'<br>'+e.categoria+'</a>';});html+='</div>';week.innerHTML+=html;}}
function cambiar(v){offset+=v;cargar();}
cargar();
</script></body></html>
